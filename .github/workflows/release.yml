name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pip==26.2.2 && pip install --group dev -e .
      - name: check the tag matches pyproject.toml
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: make build
      - uses: pypa/gh-action-pypi-publish@v1.13.0
      - name: github release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes $(case "${GITHUB_REF_NAME}" in *[ab]*|*rc*) echo --prerelease ;; esac) dist/*
        env:
          GH_TOKEN: ${{ github.token }}
