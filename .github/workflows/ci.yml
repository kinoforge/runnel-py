name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  RUNNEL_VERSION: 0.0.4-beta.1
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install pip==26.2.2 && pip install --group dev -e .
      - run: make lint
      - run: make build
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install pip==26.2.2 && pip install --group dev -e .
      - run: make generate
      - run: git add -N src/runnel/v1 && git diff --exit-code -- src/runnel/v1
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pip==26.2.2 && pip install --group dev -e .
      - run: make test
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pip==26.2.2 && pip install --group dev -e .
      - name: start runnel
        run: |
          docker run -d --name runnel --network host \
            -e RUNNEL_ADDR=127.0.0.1:8700 \
            -e RUNNEL_ADMIN_TOKEN=contract-admin-token-0123456789 \
            -e RUNNEL_SERVER_MIN_LEASE=1s \
            -e RUNNEL_SERVER_ALLOW_HTTP_CALLBACKS=true \
            -e RUNNEL_CALLBACKS_ALLOW_PRIVATE=true \
            ghcr.io/kinoforge/runnel:${RUNNEL_VERSION}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8700/healthz && break; sleep 1; done
      - run: make test-contract
        env:
          RUNNEL_URL: http://127.0.0.1:8700
      - if: failure()
        run: docker logs runnel
